[tool.poetry]
name = "homework-regex"
version = "0.1.0"
description = "Домашнее задание по регулярным выражениям"
authors = ["Zufar <zufar10002-art@github.com>"]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^3.0.2"
openpyxl = "^3.1.5"
pytest = "^9.0.3"
flake8 = "^7.3.0"
isort = "^8.0.1"
black = "^26.3.1"
mypy = "^1.20.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py314']

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.flake8]
max-line-length = 79
exclude = ["venv", ".git", "__pycache__", "build", "dist"]
